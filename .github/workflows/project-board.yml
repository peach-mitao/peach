name: 项目看板同步

on:
  pull_request_target:
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft]
  release:
    types: [published, edited, deleted]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Issue 的编辑、标签与开闭合并到小时同步，避免模板补齐期间逐事件移动。
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: peach-project-board
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'peach-mitao/peach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      # 组织 Project 不接受仓库的 GITHUB_TOKEN；用 Peach Board App 的安装令牌，看板上的操作记在
      # peach-board[bot] 名下，不记在维护者本人名下。令牌只覆盖应用仓库，作业结束即吊销。
      - name: 取得看板机器人令牌
        id: board-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.PROJECT_BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_BOARD_APP_KEY }}
          owner: peach-mitao
          repositories: peach
      - name: 同步 Issue、PR、已发布版本与看板
        env:
          GH_TOKEN: ${{ steps.board-token.outputs.token }}
          PYTHONUTF8: '1'
        run: python scripts/project_board.py --apply --event "$GITHUB_EVENT_PATH"
